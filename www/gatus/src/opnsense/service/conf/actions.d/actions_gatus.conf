[start]
command:/usr/local/opnsense/scripts/gatus/setup.sh; /usr/local/etc/rc.d/gatus start
parameters:
type:script
message:Starting Gatus

[stop]
command:/usr/local/etc/rc.d/gatus stop
parameters:
type:script
message:Stopping Gatus

[restart]
command:/usr/local/opnsense/scripts/gatus/setup.sh; /usr/local/etc/rc.d/gatus restart
parameters:
type:script
message:Restarting Gatus

[status]
command:/usr/local/etc/rc.d/gatus status
errors:no
parameters:
type:script_output
message:Requesting Gatus status
